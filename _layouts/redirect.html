<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.redirect_to | split: '#' | first | absolute_url | escape }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url | escape }}">
    {% include favicon.html %}
  </head>
  <body>
    <p>This content has moved to <a href="{{ page.redirect_to | relative_url | escape }}">Academic Activities</a>.</p>
  </body>
</html>
